<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="QuiQuiz — reconnais oiseaux, plantes, champignons, poissons, reptiles et pays avec Cui-Cui."
    />
    <title>QuiQuiz</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/mascot/cui-cui.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme-cuicui.css" />
  </head>
  <body class="theme-cuicui">
    <div class="side-fillers" aria-hidden="true">
      <img class="side-filler side-filler--left" src="assets/filler/borderleft.png" alt="" decoding="async" />
      <img class="side-filler side-filler--right" src="assets/filler/borderright.png" alt="" decoding="async" />
    </div>
    <div class="app">
      <header id="top"></header>
      <main id="view"></main>
      <footer class="site-footer">
        <p>© 2026 Emsacras</p>
      </footer>
    </div>
    <div id="onboarding" class="onboarding" hidden></div>
    <noscript>Active JavaScript pour jouer au quiz.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
